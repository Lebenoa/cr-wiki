<!DOCTYPE html>
<html lang="{{ ctx.lang }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="canonical" href="{{ ctx.canonical_url() }}" />
    {% for alt in ctx.langs() %}
    <link rel="alternate" hreflang="{{ alt }}" href="{{ ctx.lang_url(alt) }}" />
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ ctx.lang_url("en") }}" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/thirdparty/htmx.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/theme_editor.js" defer></script>
    <script src="/js/catalog_filter.js" defer></script>
</head>

<body>
    {% include "navbar.html" %}

    {% block content %}{% endblock %}
</body>

</html>
