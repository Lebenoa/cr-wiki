<!DOCTYPE html>
<html lang="{{ ctx.lang }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="canonical" href="{{ ctx.canonical_url() }}" />
    {% for alt in ctx.langs() %}
    <link rel="alternate" hreflang="{{ alt }}" href="{{ ctx.lang_url(alt) }}" />
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ ctx.lang_url("en") }}" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/thirdparty/htmx.js"></script>
    <script src="/js/theme.js"></script>
</head>

<body>
    <nav class="sticky top-0 z-50 flex items-center justify-between px-8 py-4 bg-background">
        <a href="/" class="font-headline text-2xl text-primary">COOKIE//ARCHIVE</a>
        <div class="flex items-center gap-8">
            <a href="/cookies" class="{{ ctx.nav_class("cookies") }}">{{ ctx.l.t("cookies") }}</a>
            <a href="/changelog" class="{{ ctx.nav_class("changelog") }}">{{ ctx.l.t("changelog_link") }}</a>
            {% if ctx.signed_in() %}
            <span class="text-sm text-foreground-muted">{{ ctx.username() }}</span>
            <a href="/logout" class="btn-secondary">{{ ctx.l.t("logout") }}</a>
            {% else %}
            <a href="/login" class="btn-primary">{{ ctx.l.t("login") }}</a>
            <a href="/register" class="btn-secondary">{{ ctx.l.t("register") }}</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>

</html>
