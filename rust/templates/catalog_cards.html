{% for c in cards %}
<a href="/{{ section }}/{{ c.id }}" data-cr-card data-name="{{ c.name }}" data-name-en="{{ c.en_name }}"
    data-grade="{{ c.grade_slug() }}" class="entity-card">
    {% if c.has_grade() %}
    <img src="/img/grades/{{ c.grade_slug() }}.png" alt="{{ c.grade_label() }}" title="{{ c.grade_label() }}" class="size-10 self-start">
    {% endif %}
    {% match c.image %}{% when Some with (img) %}
    <img src="/img/{{ section }}/{{ img }}" alt="{{ c.name }}" class="h-20 w-full object-contain">
    {% when None %}{% endmatch %}
    <span class="card-title">{{ c.name }}</span>
    {% if c.is_evolved %}<span class="pill-primary">{{ ctx.l.t("evolved") }}</span>{% endif %}
</a>
{% endfor %}
{% if next_page > 0 %}
<div hx-get="/{{ section }}?tab={{ tab }}&page={{ next_page }}" hx-trigger="revealed" hx-swap="outerHTML"></div>
{% else %}
<div></div>
{% endif %}
