[package]
name = "cookierun"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "catch-panic", "compression-gzip", "compression-br"] }
askama = "0.16.1"
# SurrealDB client: the app never embeds a storage engine — it always talks
# to an external server (ws:// or http://) over the wire.
surrealdb = { version = "4.0.0", default-features = false, features = ["protocol-ws", "protocol-http"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "stream"] }
url = "2"
futures-util = "0.3"
serde_json = "1.0.154"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls", "webpki-roots"] }
imagesize = "0.15.0"
parking_lot = "0.13.0"

[dev-dependencies]
serde_urlencoded = "0.7.1"

[[bin]]
name = "cookierun"
path = "src/main.rs"

# The lint bar lives here so every `cargo clippy` reproduces it — a bar only
# one ad-hoc command knows is a bar nobody keeps. Pedantic yes; nursery no
# (nursery lints change between toolchains, and a moving bar gets re-broken
# on every Rust release). unwrap/expect/panic are denied in shipped code;
# main.rs relaxes them for `cfg(test)` where they are idiomatic.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

