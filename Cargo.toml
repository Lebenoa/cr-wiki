[package]
name = "cookierun"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "catch-panic", "compression-gzip", "compression-br"] }
askama = "0.16"
# SurrealDB client: the app never embeds a storage engine — it always talks
# to an external server (ws:// or http://) over the wire.
surrealdb = { version = "3.3.0", default-features = false, features = ["protocol-ws", "protocol-http"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }
serde_json = "1.0.151"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
imagesize = "0.15.0"
parking_lot = "0.12.5"

[dev-dependencies]
serde_urlencoded = "0.7.1"

[[bin]]
name = "cookierun"
path = "src/main.rs"

# The lint bar lives here so every `cargo clippy` reproduces it — a bar only
# one ad-hoc command knows is a bar nobody keeps. Pedantic yes; nursery no
# (nursery lints change between toolchains, and a moving bar gets re-broken
# on every Rust release). unwrap/expect/panic are denied in shipped code;
# main.rs relaxes them for `cfg(test)` where they are idiomatic.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

