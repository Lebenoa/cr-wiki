# Copy to Config.toml (gitignored) and adjust. Omitted fields use defaults.
# Invalid TOML or values stop startup with field-specific errors.

# Address the HTTP server binds to. 0.0.0.0 serves on all interfaces
# (needed for LAN/container access); the default is 127.0.0.1 (loopback only).
host = "0.0.0.0"

# TCP port the server listens on. Default 6785. The debug test session runs
# on 6798 (CR_TEST_PORT overrides it).
port = 6785

# Facts about the wiki itself. SITE_UTC_OFFSET_MINUTES overrides the offset.
[site]
# The site's own timezone, in minutes east of UTC: Asia/Bangkok is 420.
# A news publication date is the start of that civil day *there*, so a post
# scheduled for 2026-10-20 goes live at 2026-10-19T17:00Z — and every news date
# an author or a reader sees is the civil day in this zone. Left at 0 the wiki
# is on UTC. This is a fixed offset, not a zone name: Asia/Bangkok never shifts,
# and a zone that observes daylight saving would need it moved twice a year.
utc_offset_minutes = 0

# SurrealDB is the datastore. The app talks to an external SurrealDB server
# over ws:// or http:// — it never embeds an engine. All five fields must be
# set for the app to boot; the SURREAL_URL / SURREAL_NS / SURREAL_DB /
# SURREAL_USER / SURREAL_PASS env vars override them when set. The
# integration tests connect to the server named by CR_SURREAL_URL instead
# (CR_SURREAL_NS / CR_SURREAL_DB override the namespace/database there).
[surreal]
# Endpoint of the SurrealDB server, e.g. "http://127.0.0.1:8100" (ws:// also works; see README).
url = ""
# Namespace and database to sign in to.
namespace = ""
database = ""
# Root-level credentials the server was started with.
username = ""
password = ""

# Cloudflare Turnstile bot protection. Protected POST handlers reject with
# 403 unless siteverify passes; with no secret they reject every submission
# in release builds (fail closed) — only the debug test-session build skips
# verification. The TURNSTILE_SECRET / TURNSTILE_HOSTNAMES env vars override
# these fields when set.
[turnstile]
# Server-side siteverify secret from Cloudflare's dashboard. Empty means
# enforcement is skipped only in the debug test-session build; release
# builds reject every protected submission (fail closed).
secret = ""

# Hostname allowlist as a TOML string array; TURNSTILE_HOSTNAMES accepts
# comma-separated values as an environment override.
hostnames = ["localhost", "127.0.0.1"]

# Per-IP rate limiting for the public read endpoints (search, list/detail
# pages, API/planner AJAX). One token bucket per IP covers all endpoints
# together; a 429 is returned while the bucket is empty.
[ratelimit]
# Burst tokens granted to a fresh IP. Must be finite and greater than zero.
capacity = 60
# Tokens restored per second up to `capacity`. Must be finite and greater
# than zero.
refill = 20
# Seconds before an idle bucket may be pruned. Must be greater than zero.
idle_ttl = 300
# Sweep activates above this many entries. Must be greater than zero.
sweep_above = 2048
# Proxy IPs whose forwarded client headers (CF-Connecting-IP,
# X-Forwarded-For, X-Real-Ip) may stand in for the visitor's address when
# keying the bucket. Leave empty to key every request by its TCP peer —
# forwarded headers from any other peer are client-spoofable, and rotating
# one would hand out a fresh full bucket per request. Behind a reverse proxy
# or CDN (e.g. Cloudflare), list the proxy's IPs here or every visitor shares
# one bucket.
trusted_proxies = []

# Sign in with Google (OAuth 2.0 authorization code flow). Optional: with an
# empty section the login form offers no Google button and /auth/google
# answers 404, which is how a purely local-account wiki runs. Both fields must
# be set together; GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI
# env vars override them. Create the OAuth client in the Google Cloud console
# (APIs & Services → Credentials → OAuth client ID → Web application) and
# register the callback URL of every deployment that serves it.
[google]
client_id = ""     # GOOGLE_CLIENT_ID, e.g. 1234-abc.apps.googleusercontent.com
client_secret = "" # GOOGLE_CLIENT_SECRET; keep secrets in environment
# Exact callback URL registered with Google. Empty derives it from
# [email] site_url (or the request host with nothing configured), so a
# deployment behind a proxy usually sets it explicitly.
redirect_uri = ""  # GOOGLE_REDIRECT_URI, e.g. https://wiki.example.com/auth/google/callback

# Outgoing mail through authenticated SMTP.
# Stalwart normally offers STARTTLS on port 587 and implicit TLS on port 465.
# Plain SMTP is unsupported. EMAIL_* environment variables override fields.
[email]
from = "" # EMAIL_FROM, e.g. "Cookie Run Wiki <no-reply@lebenoa.com>"
smtp_host = "" # EMAIL_SMTP_HOST, e.g. mail.lebenoa.com
smtp_port = 587 # EMAIL_SMTP_PORT
smtp_tls = "starttls" # EMAIL_SMTP_TLS: starttls (587) or tls (465)
smtp_username = "" # EMAIL_SMTP_USERNAME
smtp_password = "" # EMAIL_SMTP_PASSWORD; keep secrets in environment
site_url = "" # EMAIL_SITE_URL; set the public wiki URL in production
