# Copy to Config.toml (gitignored) and adjust. All fields are optional —
# omitted fields fall back to the defaults in config/config.v, and
# non-positive [ratelimit] values are clamped back to those defaults at load.

# Address the HTTP server binds to. 0.0.0.0 serves on all interfaces
# (needed for LAN/container access); the default is 127.0.0.1 (loopback only).
host = "0.0.0.0"

# TCP port the server listens on. Default 6785. The debug test session runs
# on 6798 (CR_TEST_PORT overrides it).
port = 6785

# SurrealDB is the datastore. The app talks to an external SurrealDB server
# over ws:// or http:// — it never embeds an engine. All five fields must be
# set for the app to boot; the SURREAL_URL / SURREAL_NS / SURREAL_DB /
# SURREAL_USER / SURREAL_PASS env vars override them when set. The
# integration tests connect to the server named by CR_SURREAL_URL instead
# (CR_SURREAL_NS / CR_SURREAL_DB override the namespace/database there).
[surreal]
# Endpoint of the SurrealDB server, e.g. "http://127.0.0.1:8100" (ws:// also works; see README).
url = ""
# Namespace and database to sign in to.
namespace = ""
database = ""
# Root-level credentials the server was started with.
username = ""
password = ""

# Cloudflare Turnstile bot protection. Protected POST handlers reject with
# 403 unless siteverify passes; with no secret they reject every submission
# in release builds (fail closed) — only the debug test-session build skips
# verification. The TURNSTILE_SECRET / TURNSTILE_HOSTNAMES env vars override
# these fields when set.
[turnstile]
# Server-side siteverify secret from Cloudflare's dashboard. Empty means
# enforcement is skipped only in the debug test-session build; release
# builds reject every protected submission (fail closed).
secret = ""

# Comma-separated frontend-hostname allowlist checked against the hostname
# Cloudflare reports in the siteverify response. Empty falls back to
# "localhost,127.0.0.1" so development works unconfigured; production
# deployments must set the real domain or every protected submission is
# rejected (fail closed).
hostnames = "localhost,127.0.0.1"

# Per-IP rate limiting for the public read endpoints (search, list/detail
# pages, API/planner AJAX). One token bucket per IP covers all endpoints
# together; a 429 is returned while the bucket is empty.
[ratelimit]
# Burst tokens granted to a fresh IP (the bucket's ceiling). Default 60.
# Non-positive values clamp back to the default at load.
capacity = 60
# Tokens restored per second up to `capacity`. Default 20. Non-positive
# values clamp back to the default at load.
refill = 20
# Seconds a bucket may sit unused before the sweep prunes it. Default 300.
# Non-positive values clamp back to the default at load.
idle_ttl = 300
# The sweep only runs once the bucket map grows past this many entries, so
# low-traffic servers never pay for it. Default 2048. Non-positive values
# clamp back to the default at load.
sweep_above = 2048
# Proxy IPs whose forwarded client headers (CF-Connecting-IP,
# X-Forwarded-For, X-Real-Ip) may stand in for the visitor's address when
# keying the bucket. Leave empty to key every request by its TCP peer —
# forwarded headers from any other peer are client-spoofable, and rotating
# one would hand out a fresh full bucket per request. Behind a reverse proxy
# or CDN (e.g. Cloudflare), list the proxy's IPs here or every visitor shares
# one bucket.
trusted_proxies = []

# Outgoing mail. The password-reset link is the only message the app sends, and
# it goes out as a JSON POST to `endpoint` — Resend's
# `POST https://api.resend.com/emails` by default — authenticated with an
# `Authorization: Bearer <api_key>` header. The message text is rendered by the
# app's own templates, so no copy lives in a provider dashboard. The
# EMAIL_API_KEY / EMAIL_FROM / EMAIL_ENDPOINT / EMAIL_SITE_URL env vars
# override these fields when set, which keeps the secret out of the file.
[email]
# Provider API key. Empty sends nothing at all: the debug test-session build
# logs the reset link so the flow stays walkable locally, and a release build
# logs an error — either way every reset request answers with the same neutral
# page, so an unconfigured sender cannot reveal which addresses exist.
api_key = ""

# The From mailbox, "Cookie Run Wiki <no-reply@example.com>". Resend rejects a
# sender the account has not verified; its test sender
# (onboarding@resend.dev) works before a domain is set up.
from = ""

# Where sends are POSTed. Only a test or a different provider changes it.
endpoint = "https://api.resend.com/emails"

# Absolute site URL the reset link is built from, e.g.
# "https://cookierun.example". Left empty the link is built from the request's
# own Host header, which a forged header can point at another site — set it in
# production.
site_url = ""
