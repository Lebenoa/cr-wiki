<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <div class="w-full flex flex-col justify-center items-center py-12 relative">
        <div class="text-center lg:text-left mb-10">
            <h1 class="font-headline font-bold text-2xl text-accent mb-2">%share_build_message</h1>
            <p class="font-body text-lg text-secondary">%lets_register_message</p>
        </div>
        <form class="space-y-5" method="post" hx-boost="true">
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase">%username</label>
                <div class="relative group input-glow">
                    <span
                        class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </span>
                    <input
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 pl-12 pr-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                        placeholder="GingerBrave" type="text" name="username" required />
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase">%password</label>
                <div class="relative group input-glow">
                    <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors"><svg
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="16" r="1" />
                            <rect width="18" height="12" x="3" y="10" rx="2" />
                            <path d="M7 10V7a5 5 0 0 1 9.33-2.5" />
                        </svg></span>
                    <input
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 pl-12 pr-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                        placeholder="••••••••" type="password" name="password" required />
                </div>
            </div>
            <div class="cf-turnstile" data-sitekey="@{ctx.turnstile_sitekey_for_template()}" data-action="login"></div>
            <button
                class="w-full bg-primary hover:bg-primary/90 text-foreground font-headline py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] neon-glow flex items-center justify-center gap-2 group">
                <span class="group-hover:-translate-x-1 transition-transform"><svg xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-icon lucide-key">
                        <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4" />
                        <path d="m21 2-9.6 9.6" />
                        <circle cx="7.5" cy="15.5" r="5.5" />
                    </svg></span>
                %login_button_text
            </button>
        </form>
        <div class="mt-8 pt-8 border-t border-secondary/30 flex flex-row gap-2 items-center justify-center">
            <p class="font-body text-accent">%dont_have_account</p>
            <a class="inline-block font-headline text-secondary hover:text-accent hover:underline transition-colors underline flex items-center justify-center gap-1 group"
                href="/register">
                %register!
            </a>
        </div>
    </div>
</body>

</html>
