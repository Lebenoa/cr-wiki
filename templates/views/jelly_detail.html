<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <div class="page-shell">
        <a href="/jellies" hx-boost="true" class="back-link">← %jellies_page_header</a>

        <div class="mt-4 rounded-2xl border-2 border-primary/20 bg-surface/50 p-8 flex flex-col items-center gap-4">
            <img src="@{ctx.img_src('jellies', jelly_view.image)}" alt="@jelly_view.name" class="h-32 object-contain" />
            <h1 class="text-3xl font-headline font-bold text-on-surface">@jelly_view.name</h1>
            <span class="text-sm font-label uppercase text-foreground-muted">@ctx.score_label(jelly_view.score)
                %score</span>
        </div>

        @if jelly_view.makers.len > 0
        <h2 class="section-title mt-10">%jelly_makers_label</h2>
        <div class="card-grid">
            @for m in jelly_view.makers
            <a href="@m.href" hx-boost="true"
                class="entity-card">
                <img src="@{ctx.img_src(m.entity_kind + 's', m.image)}" alt="@m.name" class="h-16 w-full object-contain" />
                <span class="card-title-sm">@m.name</span>
            </a>
            @endfor
        </div>
        @end
    </div>
</body>

</html>
