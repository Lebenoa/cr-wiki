<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    @if is_admin
<div class="flex justify-end">
    <a href="/pets/@{pet.pet_id}/edit"
        class="bg-primary hover:bg-primary/90 text-foreground font-headline px-6 py-2 rounded-xl shadow-lg transition-all text-sm">
        %edit_button
    </a>
</div>
@endif
<section class="grid grid-cols-1 md:grid-cols-12 gap-8 my-16">
        <div class="md:col-span-5 relative group">
            <div
                class="absolute inset-0 bg-primary/20 blur-[60px] scale-75 group-hover:scale-90 transition-transform duration-700 rounded-full">
            </div>
            <img alt="@pet.name"
                class="relative z-10 w-full h-auto object-contain drop-shadow-[0_20px_50px_rgba(0,0,0,0.5)]"
                src="@{ctx.img_src('pets', pet.image)}" />
        </div>
        <div class="md:col-span-7 flex flex-col items-start gap-4 z-10 p-8">
            <div class="flex flex-wrap gap-3 mb-2 items-center">
                <img src="/img/grades/@{pet.grade}.png" alt="@pet.grade" class="size-12">
            </div>
            <h1 class="font-headline text-accent text-4xl leading-tight">@pet.name</h1>
            <p class="font-body text-foreground max-w-xl whitespace-pre-line">
                @if pet.description != ""
                @pet.description
                @else
                %missing_description
                @endif
            </p>
            <!-- Quick Info Panel -->
            <div class="mt-8 grid grid-cols-2 sm:grid-cols-3 gap-4 w-full">
                <div class="p-4 rounded-xl flex flex-col gap-1 border-l-4 border-primary">
                    <span class="text-xs font-label text-foreground-muted uppercase">%abilities</span>
                    <span class="text-on-surface font-bold">@pet.abilities</span>
                </div>
                <div class="p-4 rounded-xl flex flex-col gap-1 border-l-4 border-tertiary">
                    <span class="text-xs font-label text-foreground-muted uppercase">%release_date</span>
                    <span id="releaseDate" class="text-on-surface font-bold">
                        %formatting
                    </span>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('releaseDate').textContent = new Intl.DateTimeFormat('@ctx.lang', {
            month: 'long',
            day: 'numeric',
            year: 'numeric',
        }).format(new Date('@pet.release_date'));
    </script>
</body>

</html>
