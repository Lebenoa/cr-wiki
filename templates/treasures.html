<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <h1 class="page-title">%treasure_page_header</h1>

    @if ctx.is_admin()
    <div class="admin-actions">
        <a href="/treasures/new" class="btn-primary">%new_treasure_button</a>
    </div>
    @endif

    <div class="filter-bar">
        <a href="/treasures?q=@q" class="@all_cls">%treasure_tab_all</a>
        <a href="/treasures?tab=normal&q=@q" class="@normal_cls">%treasure_tab_normal</a>
        <a href="/treasures?tab=evo&q=@q" class="@evo_cls">%treasure_tab_evolved</a>
    </div>
    <form class="filter-bar" onsubmit="return false" hx-get="/treasures"
        hx-trigger="input delay:250ms" hx-target="#treasure-grid" hx-swap="innerHTML"
        hx-push-url="true">
        <input type="hidden" name="tab" value="@tab" />
        <input type="search" name="q" value="@q" placeholder="%treasure_filter_placeholder"
            autocomplete="off" class="filter-input" />
    </form>
    <div id="treasure-grid" class="catalog-grid">
        @include 'components/treasure_cards.html'
    </div>

</body>

</html>
