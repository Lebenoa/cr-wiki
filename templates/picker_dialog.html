<dialog id="dialog-{{ kind }}" data-kind="{{ kind }}" closedby="any" class="picker-dialog">
    <button type="button" onclick="this.closest('dialog').close()"
        class="btn-secondary size-8 absolute top-3 right-3">&#10005;</button>
    <h2 class="font-headline text-accent text-2xl mb-4">{{ ctx.l.t(title_key) }}</h2>
    {% if steps %}
    <div id="dialog-step-{{ kind }}" class="flex items-center gap-3 mb-4"
        data-label-cookie="{{ ctx.l.t("build_cookie_label") }}"
        data-label-cookie2="{{ ctx.l.t("build_relay_label") }}"
        data-label-pet="{{ ctx.l.t("build_pet_label") }}"
        data-label-t1="{{ ctx.l.t("build_treasure_one") }}"
        data-label-t2="{{ ctx.l.t("build_treasure_two") }}"
        data-label-t3="{{ ctx.l.t("build_treasure_three") }}">
        <span class="step-count shrink-0 text-xs font-label uppercase text-accent"></span>
        <span class="step-name shrink-0 text-xs font-label uppercase text-foreground-muted"></span>
        <div class="flex-1 h-1.5 rounded-full bg-primary/15 overflow-hidden">
            <div class="step-fill h-full rounded-full bg-accent transition-all duration-500" style="width:0"></div>
        </div>
    </div>
    {% endif %}
    <form class="picker-controls contents" onsubmit="return false"
        hx-get="/builds/options/{{ kind }}?lang={{ ctx.lang }}" hx-trigger="input delay:250ms, picker-refresh"
        hx-target="#picker-grid-{{ kind }}" hx-swap="innerHTML">
        {% if kind == "treasure" %}
        <div class="flex flex-wrap items-center gap-2 mb-4">
            <button type="button" data-tab="all" onclick="setTreasureTab('all')"
                class="state-tab active picker-tab-on">{{ ctx.l.t("treasure_tab_all") }}</button>
            <button type="button" data-tab="normal" onclick="setTreasureTab('normal')"
                class="state-tab picker-tab">{{ ctx.l.t("treasure_tab_normal") }}</button>
            <button type="button" data-tab="evo" onclick="setTreasureTab('evo')"
                class="state-tab picker-tab">{{ ctx.l.t("treasure_tab_evolved") }}</button>
        </div>
        <input type="hidden" name="tab" value="all" />
        {% endif %}
        <input type="hidden" name="sel" value="0" />
        <input type="hidden" name="partner" value="0" />
        <input type="search" name="q" placeholder="{{ ctx.l.t("build_search_placeholder") }}" autocomplete="off"
            class="picker-search" />
    </form>
    {% if kind == "treasure" %}
    <div class="shrink-0 mb-4">
        {% include "level_slider.html" %}
    </div>
    {% endif %}
    <form method="dialog" id="picker-grid-{{ kind }}" data-picker-grid class="card-grid overflow-y-auto">
        <p class="col-span-full text-center text-foreground-muted font-label uppercase py-8">
            {{ ctx.l.t("build_picker_loading") }}
        </p>
    </form>
</dialog>
