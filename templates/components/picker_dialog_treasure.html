<!-- The treasure picker modal; see picker_dialog_cookie.html. This one also
     carries the all/normal/evolved tabs and the shared level slider. The tabs
     are a hidden field on the controls form rather than a client-side hide
     pass, because the grid is paginated and the page holds only the pages it
     has scrolled through. -->
<dialog id="dialog-treasure" data-kind="treasure" closedby="any" class="picker-dialog">
    <button type="button" onclick="this.closest('dialog').close()"
        class="btn-secondary size-8 absolute top-3 right-3">✕</button>
    <h2 class="font-headline text-accent text-2xl mb-4">%build_pick_treasure</h2>
    @if picker_steps
    <div id="dialog-step-treasure" class="flex items-center gap-3 mb-4"
        data-label-t1="%build_treasure_one" data-label-t2="%build_treasure_two" data-label-t3="%build_treasure_three"
        data-title-t1="%build_pick_treasure_one" data-title-t2="%build_pick_treasure_two" data-title-t3="%build_pick_treasure_three">
        <span class="step-count shrink-0 text-xs font-label uppercase text-accent"></span>
        <span class="step-name shrink-0 text-xs font-label uppercase text-foreground-muted"></span>
        <div class="flex-1 h-1.5 rounded-full bg-primary/15 overflow-hidden">
            <div class="step-fill h-full rounded-full bg-accent transition-all duration-500" style="width:0"></div>
        </div>
    </div>
    @end
    <form class="picker-controls contents" onsubmit="return false"
        hx-get="/builds/options/treasure?lang=@ctx.lang" hx-trigger="input delay:250ms, picker-refresh"
        hx-target="#picker-grid-treasure" hx-swap="innerHTML">
        <div class="flex flex-wrap items-center gap-2 mb-4">
            <button type="button" data-tab="all" onclick="setTreasureTab('all')" class="state-tab active picker-tab-on">%treasure_tab_all</button>
            <button type="button" data-tab="normal" onclick="setTreasureTab('normal')" class="state-tab picker-tab">%treasure_tab_normal</button>
            <button type="button" data-tab="evo" onclick="setTreasureTab('evo')" class="state-tab picker-tab">%treasure_tab_evolved</button>
        </div>
        <input type="hidden" name="tab" value="all" />
        <input type="search" name="q" placeholder="%build_search_placeholder" autocomplete="off"
            class="picker-search" />
    </form>
    <div class="shrink-0 mb-4">
        @include 'components/level_slider'
    </div>
    <form method="dialog" id="picker-grid-treasure" data-picker-grid class="card-grid overflow-y-auto"
        hx-get="/builds/options/treasure?lang=@ctx.lang" hx-trigger="picker-load once" hx-swap="innerHTML">
        <p class="col-span-full text-center text-foreground-muted font-label uppercase py-8">%build_picker_loading</p>
    </form>
</dialog>
