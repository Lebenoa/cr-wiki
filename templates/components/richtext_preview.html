<!-- Live rich-text preview: static/js/richtext.js renders the preceding
     <textarea data-richtext> (same .space-y-2 container) into
     .richtext-preview-body on every input — [[links]] and {color:...}
     resolved exactly like render_rich_text. Hidden while empty. -->

    <p class="font-label text-secondary uppercase text-xs">%rich_text_preview</p>
    <div class="richtext-preview-body text-foreground leading-relaxed"></div>
</div>
