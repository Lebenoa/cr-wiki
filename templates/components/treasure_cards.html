@for treasure in treasures
<a href="/treasures/@treasure.treasure_id" data-cr-card data-name="@treasure.name" data-name-en="@treasure.en_name"
    class="entity-card">
    @if grade := treasure.grade
    <img src="/img/grades/@{grade}.png" alt="@grade" class="size-10 self-start">
    @endif
    <img src="@{ctx.img_src('treasures', treasure.image)}" alt="@treasure.name" class="h-20 w-full object-contain">
    <span class="card-title">@treasure.name</span>
    @if treasure.is_evolved
    <span class="pill-primary">%evolved</span>
    @endif
</a>
@endfor
@if next_page > 0
<div hx-get="/treasures?tab=@tab&page=@next_page" hx-trigger="revealed" hx-swap="outerHTML"></div>
@else
<div></div>
@endif
