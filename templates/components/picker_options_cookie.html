<!-- The cookie picker grid, fetched by picker.js on the dialog's first open
     (see /builds/options/:kind). Kept out of the page HTML because the three
     grids together weighed ~2.2MB on /builds. -->
<form method="dialog" class="card-grid overflow-y-auto">
    @for c in cookies
    <button type="submit" value="@c.id" data-name="@c.name" data-name-en="@c.en_name" onclick="setPicked(this)"
        class="pick-option relative border border-secondary px-4 py-2 rounded flex flex-col items-center justify-start hover:border-primary transition-colors group gap-2">
        <img src="@{ctx.img_src('cookies', c.image)}" alt="@c.name" loading="lazy"
            class="h-36 w-full object-contain" />
        <span class="text-2xl group-hover:text-primary text-secondary text-center leading-tight">@c.name</span>
    </button>
    @endfor
</form>
