<div id="form-error" hx-swap-oob="innerHTML">
    <div role="alert"
        class="flex items-start gap-3 rounded-xl border-2 border-error/60 bg-error/10 px-4 py-3">
        <svg class="size-5 shrink-0 mt-0.5 text-error" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" x2="12" y1="8" y2="12"></line>
            <line x1="12" x2="12" y1="16" y2="16"></line>
        </svg>
        <p class="font-body text-sm text-error">@err_msg</p>
    </div>
    <script>
        if (window.turnstile) turnstile.reset();
    </script>
</div>
