<!-- The treasure picker grid; see picker_options_cookie.html. This is the
     heavy one — ~815 cards, each with its normal and blessed effect lines. -->
<form method="dialog" class="card-grid overflow-y-auto">
    @for t in treasures
    <button type="submit" value="@t.id" data-name="@t.name" data-name-en="@t.en_name" data-evolved="@t.is_evolved"
        onclick="setPicked(this)"
        class="pick-option relative border border-secondary px-4 py-2 rounded flex flex-col items-center justify-start hover:border-primary transition-colors group gap-2">
        <img src="@{ctx.img_src('treasures', t.image)}" alt="@t.name" loading="lazy"
            class="h-36 w-full object-contain" />
        <span class="text-2xl group-hover:text-primary text-secondary text-center leading-tight">@t.name</span>
        @if t.effects.len > 0 || t.effects_blessed.len > 0
        <span class="fx-line flex flex-col items-center gap-1">
            <span class="fx-effects flex flex-col items-center gap-0.5" data-state="normal">
                @for e in t.effects
                <span class="fx-effect text-xs text-foreground-muted text-center leading-snug">
                    @if e.values.len > 0
                    <span class="fx-val text-accent" data-values="@{e.values.join('|')}">
                        @if e.values.len > 9
                        @{e.values.last()}
                        @end
                    </span>
                    @end
                    <span class="fx-name">@e.text</span>
                </span>
                @endfor
            </span>
            @if t.has_blessed_toggle
            <span class="fx-effects hidden flex flex-col items-center gap-0.5" data-state="blessed">
                @for e in t.effects_blessed
                <span class="fx-effect text-xs text-foreground-muted text-center leading-snug">
                    @if e.values.len > 0
                    <span class="fx-val text-accent" data-values="@{e.values.join('|')}">
                        @if e.values.len > 9
                        @{e.values.last()}
                        @end
                    </span>
                    @end
                    <span class="fx-name">@e.text</span>
                </span>
                @endfor
            </span>
            <span class="fx-toggle flex items-center gap-1 text-xs font-label uppercase cursor-pointer select-none"
                onclick="event.stopPropagation()">
                <span class="fx-pill active rounded-full px-2 py-0.5 border border-accent text-accent"
                    data-state="normal" onclick="toggleFx(event, this)">%state_normal</span>
                <span class="fx-pill rounded-full px-2 py-0.5 border border-secondary/40 text-foreground-muted"
                    data-state="blessed" onclick="toggleFx(event, this)">%state_blessed</span>
            </span>
            @end
            <!-- per-card 0-9 level stepper: lets planners compare two
                 treasures at different levels side by side. The step
                 buttons are built lazily by picker.js on dialog open;
                 this container's stopPropagation keeps clicks in the
                 row from activating the card's submit button. -->
            <span class="fx-stepper flex items-center justify-center gap-0.5 mt-1 text-[10px] font-bold leading-tight"
                onclick="event.stopPropagation()"></span>
        </span>
        @end
    </button>
    @endfor
</form>
