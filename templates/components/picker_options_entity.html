@if options.len == 0
<p class="col-span-full text-center text-foreground-muted py-8">%search_no_results</p>
@end
@for o in options
@if o.id == sel
<button type="submit" value="@o.id" data-name="@o.name" data-name-en="@o.en_name" data-selected="1"
    aria-current="true" onclick="setPicked(this)"
    class="pick-option relative border-2 border-primary ring-2 ring-primary px-4 py-2 rounded flex flex-col items-center justify-start transition-colors group gap-2">
@else
<button type="submit" value="@o.id" data-name="@o.name" data-name-en="@o.en_name" onclick="setPicked(this)"
    class="pick-option relative border border-secondary px-4 py-2 rounded flex flex-col items-center justify-start hover:border-primary transition-colors group gap-2">
@end
    @if g := o.grade
    <img src="/img/grades/@{g}.png" alt="@g" class="size-8 absolute top-1 left-1" />
    @end
    <img src="@{ctx.img_src(img_dir, o.image)}" alt="@o.name" loading="lazy"
        class="h-36 w-full object-contain" />
    <span class="text-2xl group-hover:text-primary text-secondary text-center leading-tight">@o.name</span>
    @if o.id in is_combi
    <span class="pill-accent">%combo_bonus_title</span>
    @end
</button>
@endfor
@if next_url != ''
<div class="col-span-full flex items-center justify-center py-6 text-foreground-muted font-label uppercase"
    hx-get="@next_url" hx-trigger="revealed" hx-swap="outerHTML">%build_picker_loading</div>
@end
