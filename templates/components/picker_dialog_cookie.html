<!-- The cookie picker modal, shared by /builds (filter) and the planner. The
     option grid is paginated: the dialog's first open fetches page 1 (picker.js
     fires `picker-load`), scrolling pulls the rest through the sentinel each
     page ends with, and the search box re-queries from page 1 — see
     /builds/options/:kind. Set `picker_steps` in the handler: true adds the
     planner's n/6 step header, false leaves it out for the /builds filter
     dialogs, which are not a flow. -->
<dialog id="dialog-cookie" data-kind="cookie" closedby="any" class="picker-dialog">
    <button type="button" onclick="this.closest('dialog').close()"
        class="btn-secondary size-8 absolute top-3 right-3">✕</button>
    <h2 class="font-headline text-accent text-2xl mb-4">%build_pick_cookie</h2>
    @if picker_steps
    <div id="dialog-step-cookie" class="flex items-center gap-3 mb-4"
        data-label-cookie="%build_cookie_label" data-label-cookie2="%build_relay_label"
        data-title-cookie="%build_pick_cookie" data-title-cookie2="%build_pick_relay">
        <span class="step-count shrink-0 text-xs font-label uppercase text-accent"></span>
        <span class="step-name shrink-0 text-xs font-label uppercase text-foreground-muted"></span>
        <div class="flex-1 h-1.5 rounded-full bg-primary/15 overflow-hidden">
            <div class="step-fill h-full rounded-full bg-accent transition-all duration-500" style="width:0"></div>
        </div>
    </div>
    @end
    <!-- display:contents so the controls keep their own places in the dialog's
         flex column. A form, not loose inputs, so htmx serializes the query
         exactly once; onsubmit is stubbed out because Enter in a search box
         would otherwise navigate. -->
    <form class="picker-controls contents" onsubmit="return false"
        hx-get="/builds/options/cookie?lang=@ctx.lang" hx-trigger="input delay:250ms, picker-refresh"
        hx-target="#picker-grid-cookie" hx-swap="innerHTML">
        <!-- the slot's current pick, filled by picker.js on open: the server
             pins it to the front of the grid so a reopened slot shows it -->
        <input type="hidden" name="sel" value="0" />
        <input type="search" name="q" placeholder="%build_search_placeholder" autocomplete="off"
            class="picker-search" />
    </form>
    <!-- the grid does not fetch on its own: picker.js triggers the controls
         form above, so the search term, the tab and the pinned selection
         always travel together -->
    <form method="dialog" id="picker-grid-cookie" data-picker-grid class="card-grid overflow-y-auto">
        <p class="col-span-full text-center text-foreground-muted font-label uppercase py-8">%build_picker_loading</p>
    </form>
</dialog>
