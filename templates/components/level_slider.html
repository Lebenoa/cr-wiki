<div class="level-slider-control flex items-center gap-3 rounded-xl bg-secondary/10 px-4 py-2">
    <span class="text-xs font-label text-foreground-muted uppercase shrink-0">%level</span>
    <div class="flex-1 min-w-0">
        <input type="range" class="level-slider w-full h-4 appearance-none bg-transparent cursor-pointer outline-none"
            min="0" max="9" step="1" value="9" />
        <div class="level-slider-ticks mt-1 flex justify-between px-1">
            <span data-tick="0" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="1" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="2" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="3" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="4" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="5" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="6" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="7" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="8" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
            <span data-tick="9" class="w-0.5 h-1.5 rounded-full bg-secondary/40 transition-colors duration-200"></span>
        </div>
    </div>
    <input type="number" class="level-slider-input w-16 text-center rounded-lg bg-surface border border-secondary/40 px-2 py-1 font-bold text-on-surface"
        min="0" max="9" value="9" />
</div>
