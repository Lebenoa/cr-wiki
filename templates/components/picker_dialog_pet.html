<!-- The pet picker modal; see picker_dialog_cookie.html. -->
<dialog id="dialog-pet" data-kind="pet" closedby="any" class="picker-dialog">
    <button type="button" onclick="this.closest('dialog').close()"
        class="btn-secondary size-8 absolute top-3 right-3">✕</button>
    <h2 class="font-headline text-accent text-2xl mb-4">%build_pick_pet</h2>
    @if picker_steps
    <div id="dialog-step-pet" class="flex items-center gap-3 mb-4" data-label-pet="%build_pet_label">
        <span class="step-count shrink-0 text-xs font-label uppercase text-accent"></span>
        <span class="step-name shrink-0 text-xs font-label uppercase text-foreground-muted"></span>
        <div class="flex-1 h-1.5 rounded-full bg-primary/15 overflow-hidden">
            <div class="step-fill h-full rounded-full bg-accent transition-all duration-500" style="width:0"></div>
        </div>
    </div>
    @end
    <form class="picker-controls contents" onsubmit="return false"
        hx-get="/builds/options/pet?lang=@ctx.lang" hx-trigger="input delay:250ms, picker-refresh"
        hx-target="#picker-grid-pet" hx-swap="innerHTML">
        <!-- the slot's current pick, filled by picker.js on open: the server
             pins it to the front of the grid so a reopened slot shows it -->
        <input type="hidden" name="sel" value="0" />
        <!-- the other half of the pair (the picked pet here, the picked cookie
             in the pet dialog): its combo partners are listed first -->
        <input type="hidden" name="partner" value="0" />
        <input type="search" name="q" placeholder="%build_search_placeholder" autocomplete="off"
            class="picker-search" />
    </form>
    <!-- the grid does not fetch on its own: picker.js triggers the controls
         form above, so the search term, the tab and the pinned selection
         always travel together -->
    <form method="dialog" id="picker-grid-pet" data-picker-grid class="card-grid overflow-y-auto">
        <p class="col-span-full text-center text-foreground-muted font-label uppercase py-8">%build_picker_loading</p>
    </form>
</dialog>
