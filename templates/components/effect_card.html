<div class="effect-card p-4 rounded-xl border-l-4 border-primary">
    <div class="grid grid-cols-2 gap-2 text-center">
        <span class="text-accent font-bold">
            @effect.value0
            @if effect.diff0 != ''
            <span class="text-foreground-muted">(@effect.diff0)</span>
            @endif
        </span>
        <span class="text-accent font-bold">
            @effect.value9
            @if effect.diff9 != ''
            <span class="text-foreground-muted">(@effect.diff9)</span>
            @endif
        </span>
    </div>
    <p class="mt-1 text-center text-on-surface">@effect.name</p>
</div>
