<div class="effect-card grid grid-cols-[4rem_4rem_1fr] items-center gap-2 p-4 rounded-xl border-l-4 border-primary">
    <span class="flex flex-col items-center gap-1 text-accent font-bold">
        <span>@effect.value0</span>
        <span class="effect-diff h-5 text-xs leading-tight text-foreground-muted">@effect.diff0</span>
    </span>
    <span class="flex flex-col items-center gap-1 text-accent font-bold">
        <span>@effect.value9</span>
        <span class="effect-diff h-5 text-xs leading-tight text-foreground-muted">@effect.diff9</span>
    </span>
    @if effect.name_html != ''
    <p class="text-on-surface">@effect.name_html</p>
    @else
    <p class="text-on-surface">@effect.name</p>
    @endif
</div>
