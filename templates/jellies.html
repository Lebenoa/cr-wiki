<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <h1 class="page-title">%jellies_page_header</h1>

    <div class="filter-bar">
        @include 'components/filter_input.html'
    </div>

    <div class="catalog-grid">
        @for j in jelly_views
        <a href="/jellies/@j.jelly_id" hx-boost="true" data-cr-card data-name="@j.name"
            class="entity-card">
            <img src="@{ctx.img_src('jellies', j.image)}" alt="@j.name" class="h-20 w-full object-contain" />
            <span class="card-title">@j.name</span>
            <span class="card-meta">@ctx.score_label(j.score)
                %score</span>
        </a>
        @endfor
    </div>
</body>

</html>
