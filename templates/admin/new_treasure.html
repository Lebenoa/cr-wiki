<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <div class="w-full flex flex-col justify-center items-center py-12 relative">
        <div class="text-center mb-10">
            @if state.edit_mode
            <h1 class="font-headline font-bold text-2xl text-accent mb-2">%edit_treasure_page_header</h1>
            <p class="font-body text-lg text-secondary">%edit_treasure_subtitle</p>
            @else
            <h1 class="font-headline font-bold text-2xl text-accent mb-2">%new_treasure_page_header</h1>
            <p class="font-body text-lg text-secondary">%new_treasure_subtitle</p>
            @endif
        </div>
        <form class="space-y-5 w-full max-w-2xl" method="post"
            @if state.edit_mode
            action="/treasures/@state.id/edit"
            @else
            action="/treasures/new"
            @endif
            enctype="multipart/form-data">
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="image">%image</label>
                <label for="image" class="flex flex-col w-fit mx-auto gap-2 cursor-pointer group">
                    <img id="imagePreview" alt="%image"
                        class="size-36 rounded-xl object-contain border-2 border-dashed border-primary/40 bg-surface group-hover:border-primary group-hover:bg-primary/10 transition-all
                        @if !state.edit_mode
                        hidden
                        @endif
                        "
                        src="@{ctx.img_src('treasures', state.image)}" />
                    <span
                        class="w-full min-w-40 bg-surface border-2 border-dashed border-primary/40 rounded-xl py-3 px-4 text-sm font-semibold text-foreground-muted group-hover:border-primary group-hover:text-foreground transition-all text-center">%choose_image</span>
                </label>
                <input id="image" type="file" name="image" accept="image/*" class="sr-only" />
            </div>
            <script>
                document.getElementById('image').addEventListener('change', function (e) {
                    var file = e.target.files && e.target.files[0];
                    var preview = document.getElementById('imagePreview');
                    if (file) {
                        var reader = new FileReader();
                        reader.onload = function (ev) {
                            preview.src = ev.target.result;
                            preview.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });
            </script>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="lang">%language</label>
                <select id="lang" name="lang"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                    @for lang in languages
                    @if lang == state.lang
                    <option value="@lang" selected>@{ctx.lang_map(lang)}</option>
                    @else
                    <option value="@lang">@{ctx.lang_map(lang)}</option>
                    @endif
                    @endfor
                </select>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="name">%treasure_name</label>
                <input id="name"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                    type="text" name="name" placeholder="Pilgrim's Scroll" required value="@state.name" />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="grade">%grade</label>
                    <select id="grade" name="grade"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                        <option value=""
                            @if state.grade == ""
                            selected
                            @endif
                        >%no_grade</option>
                        @for g in grades
                        <option value="@g"
                            @if g == state.grade
                            selected
                            @endif
                        >@{ctx.grade_name(g)}</option>
                        @endfor
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="is_evolved">%evolved</label>
                    <select id="is_evolved" name="is_evolved"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                        <option value="false"
                            @if !state.is_evolved
                            selected
                            @endif
                        >No</option>
                        <option value="true"
                            @if state.is_evolved
                            selected
                            @endif
                        >Yes</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="release_date">%release_date</label>
                    <input id="release_date"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none"
                        type="date" name="release_date" value="@state.release_date" />
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="unlock_cookie_id">%unlock_cookie_label</label>
                    <select id="unlock_cookie_id" name="unlock_cookie_id"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                        <option value=""
                            @if state.unlock_cookie_id == 0
                            selected
                            @endif
                        >%none_option</option>
                        @for c in state.cookies
                        <option value="@c.id"
                            @if c.id == state.unlock_cookie_id
                            selected
                            @endif
                        >@c.name</option>
                        @endfor
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="unlock_pet_id">%unlock_pet_label</label>
                    <select id="unlock_pet_id" name="unlock_pet_id"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                        <option value=""
                            @if state.unlock_pet_id == 0
                            selected
                            @endif
                        >%none_option</option>
                        @for p in state.pets
                        <option value="@p.id"
                            @if p.id == state.unlock_pet_id
                            selected
                            @endif
                        >@p.name</option>
                        @endfor
                    </select>
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase">%treasure_effects</label>
                <div id="effects-rows" class="space-y-2">
                    @for i, e in state.effects
                    <div class="effect-row rounded-xl border-2 border-primary/20 bg-surface/50 p-3 space-y-2">
                        <select data-effect-select
                            class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                            <option value="">%effects_hint</option>
                            @for n in state.effect_names
                            <option value="@n">@n</option>
                            @endfor
                            <option value="__new__">%new_effect</option>
                        </select>
                        <div class="grid gap-2 items-center" style="grid-template-columns: 1fr auto;">
                            <input type="text" data-field="name"
                                class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                                name="effects_name_@i" placeholder="%new_effect_hint" value="@e.name" />
                            <input type="text" data-field="value"
                                class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                                name="effects_value_@i" placeholder="%effect_value_hint" value="@e.value" />
                            <button type="button" data-remove-effect aria-label="%remove_effect"
                                class="size-11 rounded-xl border-2 border-primary/30 text-foreground-muted hover:border-primary hover:text-foreground transition-all">×</button>
                        </div>
                    </div>
                    @endfor
                </div>
                <button type="button" data-add-effect="effects"
                    class="w-full bg-surface border-2 border-dashed border-primary/40 rounded-xl py-3 px-4 text-sm font-semibold text-foreground-muted hover:border-primary hover:text-foreground transition-all text-center">+ %add_effect</button>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase">%blessed_effects</label>
                <div id="blessed_effects-rows" class="space-y-2">
                    @for i, e in state.blessed_effects
                    <div class="effect-row rounded-xl border-2 border-primary/20 bg-surface/50 p-3 space-y-2">
                        <select data-effect-select
                            class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                            <option value="">%effects_hint</option>
                            @for n in state.effect_names
                            <option value="@n">@n</option>
                            @endfor
                            <option value="__new__">%new_effect</option>
                        </select>
                        <div class="grid gap-2 items-center" style="grid-template-columns: 1fr auto;">
                            <input type="text" data-field="name"
                                class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                                name="blessed_effects_name_@i" placeholder="%new_effect_hint" value="@e.name" />
                            <input type="text" data-field="value"
                                class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                                name="blessed_effects_value_@i" placeholder="%effect_value_hint" value="@e.value" />
                            <button type="button" data-remove-effect aria-label="%remove_effect"
                                class="size-11 rounded-xl border-2 border-primary/30 text-foreground-muted hover:border-primary hover:text-foreground transition-all">×</button>
                        </div>
                    </div>
                    @endfor
                </div>
                <button type="button" data-add-effect="blessed_effects"
                    class="w-full bg-surface border-2 border-dashed border-primary/40 rounded-xl py-3 px-4 text-sm font-semibold text-foreground-muted hover:border-primary hover:text-foreground transition-all text-center">+ %add_effect</button>
            </div>
            <template id="effect-row-template">
                <div class="effect-row rounded-xl border-2 border-primary/20 bg-surface/50 p-3 space-y-2">
                    <select data-effect-select
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                        <option value="">%effects_hint</option>
                        @for n in state.effect_names
                        <option value="@n">@n</option>
                        @endfor
                        <option value="__new__">%new_effect</option>
                    </select>
                    <div class="grid gap-2 items-center" style="grid-template-columns: 1fr auto;">
                        <input type="text" data-field="name"
                            class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                            name="effects_name_x" placeholder="%new_effect_hint" value="" />
                        <input type="text" data-field="value"
                            class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                            name="effects_value_x" placeholder="%effect_value_hint" value="" />
                        <button type="button" data-remove-effect aria-label="%remove_effect"
                            class="size-11 rounded-xl border-2 border-primary/30 text-foreground-muted hover:border-primary hover:text-foreground transition-all">×</button>
                    </div>
                </div>
            </template>
            <script>
                (function () {
                    function renumber(container, prefix) {
                        var rows = container.querySelectorAll('.effect-row');
                        rows.forEach(function (row, i) {
                            row.querySelector('[data-field="name"]').name = prefix + '_name_' + i;
                            row.querySelector('[data-field="value"]').name = prefix + '_value_' + i;
                        });
                    }
                    // initEffectRow wires a row's combobox: an existing effect
                    // name from the list hides the name input (its value is
                    // submitted for reuse), "New Effect" shows it for typing a
                    // fresh name, and the blank option keeps the input visible.
                    function initEffectRow(row) {
                        var sel = row.querySelector('[data-effect-select]');
                        var input = row.querySelector('[data-field="name"]');
                        if (!sel || !input) return;
                        var val = input.value;
                        var found = false;
                        for (var i = 0; i < sel.options.length; i++) {
                            if (sel.options[i].value === val && val !== '') {
                                sel.selectedIndex = i;
                                found = true;
                                break;
                            }
                        }
                        if (found) {
                            input.classList.add('hidden');
                        } else {
                            sel.value = '__new__';
                            input.classList.remove('hidden');
                        }
                        sel.addEventListener('change', function () {
                            if (sel.value === '__new__') {
                                input.classList.remove('hidden');
                                input.focus();
                            } else if (sel.value === '') {
                                input.classList.remove('hidden');
                            } else {
                                input.value = sel.value;
                                input.classList.add('hidden');
                            }
                        });
                    }
                    var tpl = document.getElementById('effect-row-template');
                    document.querySelectorAll('[data-add-effect]').forEach(function (btn) {
                        var prefix = btn.getAttribute('data-add-effect');
                        var container = document.getElementById(prefix + '-rows');
                        btn.addEventListener('click', function () {
                            var row = tpl.content.firstElementChild.cloneNode(true);
                            container.appendChild(row);
                            renumber(container, prefix);
                            initEffectRow(row);
                        });
                    });
                    document.addEventListener('click', function (e) {
                        var btn = e.target.closest('[data-remove-effect]');
                        if (btn) {
                            var row = btn.closest('.effect-row');
                            var container = row.parentElement;
                            var prefix = container.id.replace('-rows', '');
                            row.remove();
                            renumber(container, prefix);
                        }
                    });
                    // init server-rendered rows (edit mode)
                    document.querySelectorAll('.effect-row').forEach(initEffectRow);
                    document.querySelector('form').addEventListener('submit', function () {
                        document.querySelectorAll('[data-add-effect]').forEach(function (btn) {
                            var prefix = btn.getAttribute('data-add-effect');
                            renumber(document.getElementById(prefix + '-rows'), prefix);
                        });
                    });
                })();
            </script>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="description">%description</label>
                <textarea id="description" name="description" rows="4"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none resize-y">@state.description</textarea>
            </div>
            <button type="submit"
                class="w-full bg-primary hover:bg-primary/90 text-foreground font-headline py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                @if state.edit_mode
                %save_treasure_button
                @else
                %create_treasure_button
                @endif
            </button>
        </form>
    </div>
</body>

</html>
