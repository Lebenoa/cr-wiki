<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <div class="w-full flex flex-col justify-center items-center py-12 relative">
        <div class="text-center mb-10">
            @if state.edit_mode
            <h1 class="font-headline font-bold text-2xl text-accent mb-2">%edit_pet_page_header</h1>
            <p class="font-body text-lg text-secondary">%edit_pet_subtitle</p>
            @else
            <h1 class="font-headline font-bold text-2xl text-accent mb-2">%new_pet_page_header</h1>
            <p class="font-body text-lg text-secondary">%new_pet_subtitle</p>
            @endif
        </div>
        <form class="space-y-5 w-full max-w-2xl" method="post"
            @if state.edit_mode
            action="/pets/@state.id/edit"
            @else
            action="/pets/new"
            @endif
            enctype="multipart/form-data">
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="image">%image</label>
                <label for="image" class="flex flex-col w-fit mx-auto gap-2 cursor-pointer group">
                    <img id="imagePreview" alt="%image"
                        class="size-36 rounded-xl object-contain border-2 border-dashed border-primary/40 bg-surface group-hover:border-primary group-hover:bg-primary/10 transition-all
                        @if !state.edit_mode
                        hidden
                        @endif
                        "
                        src="@{ctx.img_src('pets', state.image)}" />
                    <span
                        class="w-full min-w-40 bg-surface border-2 border-dashed border-primary/40 rounded-xl py-3 px-4 text-sm font-semibold text-foreground-muted group-hover:border-primary group-hover:text-foreground transition-all text-center">%choose_image</span>
                </label>
                <input id="image" type="file" name="image" accept="image/*" class="sr-only" />
            </div>
            <script>
                document.getElementById('image').addEventListener('change', function (e) {
                    var file = e.target.files && e.target.files[0];
                    var preview = document.getElementById('imagePreview');
                    if (file) {
                        var reader = new FileReader();
                        reader.onload = function (ev) {
                            preview.src = ev.target.result;
                            preview.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });
            </script>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="lang">%language</label>
                <select id="lang" name="lang"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                    @for lang in languages
                    @if lang == state.lang
                    <option value="@lang" selected>@{ctx.lang_map(lang)}</option>
                    @else
                    <option value="@lang">@{ctx.lang_map(lang)}</option>
                    @endif
                    @endfor
                </select>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="name">%pet_name</label>
                <input id="name"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none"
                    type="text" name="name" placeholder="GingerBright" required value="@state.name" />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase">%grade</label>
                    <div class="flex flex-wrap gap-3">
                        @for g in grades
                        <label class="cursor-pointer transition-all hover:scale-105" title="@{ctx.grade_name(g)}">
                            <input class="peer sr-only" type="radio" name="grade" value="@g" required
                                @if g == state.grade
                                checked
                                @endif
                            />
                            <img src="/img/grades/@{g}.png" alt="@g"
                                class="size-16 rounded-xl border-2 border-transparent bg-surface peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary transition-all" />
                        </label>
                        @endfor
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="font-label text-secondary uppercase" for="release_date">%release_date</label>
                    <input id="release_date"
                        class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none"
                        type="date" name="release_date" value="@state.release_date" />
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="unlock_treasure_id">%unlock_treasure_label</label>
                <select id="unlock_treasure_id" name="unlock_treasure_id"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground focus:border-primary focus:ring-0 transition-all outline-none">
                    <option value=""
                        @if state.unlock_treasure_id == 0
                        selected
                        @endif
                    >%none_option</option>
                    @for t in state.treasures
                    <option value="@t.id"
                        @if t.id == state.unlock_treasure_id
                        selected
                        @endif
                    >@t.name</option>
                    @endfor
                    <option value="__new__">%new_treasure</option>
                </select>
                <input id="new_treasure_name" type="text" name="new_treasure_name"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none hidden"
                    placeholder="%new_treasure_hint" />
            </div>
            <script>
                (function () {
                    var sel = document.getElementById('unlock_treasure_id');
                    var input = document.getElementById('new_treasure_name');
                    sel.addEventListener('change', function () {
                        if (sel.value === '__new__') {
                            input.classList.remove('hidden');
                            input.focus();
                        } else {
                            input.classList.add('hidden');
                        }
                    });
                })();
            </script>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="abilities">%abilities</label>
                <textarea id="abilities" name="abilities" rows="4"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none resize-y"
                    required>@state.abilities</textarea>
            </div>
            <div class="space-y-2">
                <label class="font-label text-secondary uppercase" for="description">%description</label>
                <textarea id="description" name="description" rows="4"
                    class="w-full bg-surface border-2 border-primary/30 rounded-xl py-3 px-4 text-foreground placeholder:text-foreground/30 focus:border-primary focus:ring-0 transition-all outline-none resize-y">@state.description</textarea>
            </div>
            <button type="submit"
                class="w-full bg-primary hover:bg-primary/90 text-foreground font-headline py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                @if state.edit_mode
                %save_pet_button
                @else
                %create_pet_button
                @endif
            </button>
        </form>
    </div>
</body>

</html>
