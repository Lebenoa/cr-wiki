<div class="effect-card grid grid-cols-[4rem_1fr] items-start gap-2 p-4 rounded-xl border-l-4 border-primary">
    <span class="flex flex-col items-center gap-1 text-accent font-bold">
        <span class="effect-value" data-values="{{ e.values_attr() }}">{{ e.top() }}</span>

    <p class="text-on-surface">{{ e.text }}</p>
