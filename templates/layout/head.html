<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/styles.css">
<link rel="shortcut icon" href="/favicon.avif" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
@if ctx.lang == 'en'
<link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Sora:wght@100..800&display=swap"
    rel="stylesheet">
@else if ctx.lang == 'th'
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
@end
<script src="/thirdparty/htmx.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/theme_editor.js" defer></script>
<script src="/js/catalog_filter.js" defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<title>@ctx.page_title</title>
<meta name="description" content="@ctx.meta_description()">
<link rel="canonical" href="@ctx.canonical_url()">
@for alt_lang in ctx.alt_langs()
<link rel="alternate" hreflang="@alt_lang" href="@{ctx.lang_url(alt_lang)}">
@endfor
<link rel="alternate" hreflang="x-default" href="@ctx.default_lang_url()">
@if ctx.noindex
<meta name="robots" content="noindex, nofollow">
@else
<meta name="robots" content="index, follow">
@end
<meta property="og:type" content="website">
<meta property="og:site_name" content="%site_name">
<meta property="og:title" content="@ctx.page_title">
<meta property="og:description" content="@ctx.meta_description()">
<meta property="og:url" content="@ctx.canonical_url()">
<meta property="og:locale" content="@ctx.og_locale()">
<meta property="og:image" content="@ctx.social_image()">
<meta property="og:image:alt" content="@ctx.page_title">
<meta name="twitter:card" content="@ctx.social_card_type()">
<meta name="twitter:title" content="@ctx.page_title">
<meta name="twitter:description" content="@ctx.meta_description()">
<meta name="twitter:image" content="@ctx.social_image()">
<script>
    htmx.config.globalViewTransitions = true;
</script>
