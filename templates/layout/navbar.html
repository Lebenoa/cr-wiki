<nav class="sticky top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-secondary/50 shadow-xl px-2">
    <div class="flex items-center justify-between h-20 mx-auto">
        <div class="flex items-center gap-12">
            <a class="font-bold text-2xl tracking-tight text-primary flex items-center gap-2 font-headline" href="/"
                hx-boost="true">
                <img class="size-10" src="/favicon.avif" alt="home icon">
                <span class="hidden md:block">
                    COOKIE//ARCHIVE
                </span>
            </a>
            <div class="hidden lg:flex gap-8 items-center" hx-boost:inherited="true">
                @{ctx.nav_link('cookies')}
                @{ctx.nav_link('pets')}
                @{ctx.nav_link('treasures')}
                @{ctx.nav_link('builds')}
            </div>
        </div>
        <div class="flex items-center gap-6">
            <button id="search-toggle" type="button" class="btn-secondary size-12 md:hidden"
                aria-label="%navbar_search_toggle" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
            </button>
            <div id="search-box"
                class="relative flex-1 min-w-0 md:block md:flex-none md:w-56 lg:w-72 hidden transition-all transition-discrete duration-300 max-md:opacity-0 max-md:-translate-y-2 max-md:[&.open]:opacity-100 max-md:[&.open]:translate-y-0 max-md:[&.open]:starting:opacity-0 max-md:[&.open]:starting:-translate-y-2">
                <form class="relative" action="/search" method="get" hx-boost="true">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-foreground-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                    </span>
                    <input name="q" hx-get="/search" hx-trigger="input changed delay:300ms"
                        hx-target="#search-results" hx-swap="innerHTML"
                        class="bg-surface border-2 border-secondary/50 focus:border-primary focus:ring-0 rounded-full py-2 pl-12 pr-6 w-full transition-all outline-none text-sm text-foreground"
                        placeholder="%navbar_search_placeholder" type="text" />
                </form>
                <div id="search-results"
                    class="absolute top-full left-0 mt-2 w-full max-h-96 overflow-y-auto rounded-xl border border-secondary/70 bg-background shadow-2xl z-50 hidden flex-col p-2 gap-1">
                </div>
                <div id="search-loading"
                    class="hidden absolute top-full left-0 mt-2 w-full rounded-xl border border-secondary/70 bg-background shadow-2xl p-2 flex items-center gap-2 text-sm text-foreground-muted transition-all transition-discrete duration-200 opacity-0 not-[.hidden]:opacity-100 not-[.hidden]:starting:opacity-0">
                    <svg class="size-4 animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                    <span>%navbar_search_loading</span>
                </div>
            </div>
            <button class="btn-primary size-12" popovertarget="account-dropdown">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
            <div id="account-dropdown"
                class="p-4 m-bs-1 inline-64 bg-background text-foreground rounded border border-accent transition-discrete transition-all duration-300 flex-col gap-2 hidden popover-open:flex"
                popover>
                @if user := ctx.user
                <a href="/me" class="btn hover:bg-primary/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <p>@{user.username}</p>
                </a>
                @else
                <div class="flex flex-col gap-2">
                    <a href="/login" class="btn-primary">%login</a>
                    <a href="/register" class="btn-secondary">%register</a>
                </div>
                @endif
                <button class="btn hover:bg-secondary/20" command="show-modal" commandfor="language-dropdown">%language:
                    <span class="font-bold uppercase">@ctx.lang</span></button>
                <!-- <button class="btn-warning" popovertarget="account-dropdown" popovertargetaction="close">Close</button> -->
            </div>
            <dialog
                class="hidden open:flex flex-col items-center gap-4 border-secondary/70 border rounded p-8 w-[min(90vw,40rem)] max-h-[90vh] overflow-auto shadow-2xl bg-black text-foreground m-auto transition-discrete transition-all opacity-0 open:starting:opacity-0 open:opacity-100 duration-300"
                backdrop:transition-all backdrop:transition-discrete backdrop:opacity-0 backdrop:bg-black
                backdrop:open:opacity-40 backdrop:open:backdrop-blur-sm backdrop:open:blur-sm
                backdrop:open:starting:opacity-0 closedby="any" id="language-dropdown">
                <div hx-trigger="revealed" hx-get="/api/available-langs" hx-target="this" hx-swap="outerHTML">
                    Loading...
                </div>
                <button class="btn-warning mx-auto" command="close" commandfor="language-dropdown">%close</button>
            </dialog>
        </div>
    </div>
    <script>
        (function () {
            const btn = document.getElementById('search-toggle');
            const box = document.getElementById('search-box');
            if (!btn || !box) return;
            const input = box.querySelector('input[name=q]');
            const results = document.getElementById('search-results');
            const indicator = document.getElementById('search-loading');
            // the collapsible state only exists below md: on desktop the box is
            // always visible (md:block) even though the hidden class stays in
            // the markup, so isOpen() must not gate desktop behavior
            function isMobile() {
                return window.matchMedia('(max-width: 767px)').matches;
            }
            function isOpen() {
                return !box.classList.contains('hidden');
            }
            function setOpen(open) {
                box.classList.toggle('hidden', !open);
                box.classList.toggle('open', open);
                btn.classList.toggle('hidden', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (open) {
                    input?.focus();
                } else {
                    input?.blur();
                    input.value = '';
                    results.innerHTML = '';
                    results.classList.add('hidden');
                    results.classList.remove('flex');
                    indicator?.classList.add('hidden');
                }
            }
            btn.addEventListener('click', function () {
                setOpen(!isOpen());
            });
            // reveal the spinner during the debounce window, before htmx fires
            input.addEventListener('input', function () {
                indicator?.classList.toggle('hidden', input.value.trim() === '');
            });
            document.addEventListener('click', function (e) {
                // close only on mobile and outside the search control; the toggle's
                // own click bubbles here and must not close the box it just opened
                if (isMobile() && isOpen() && !e.target.closest('#search-toggle, #search-box')) {
                    setOpen(false);
                }
            });
            box.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') setOpen(false);
            });
            // show the dropdown only once it has content, so a focused-but-empty
            // input never displays an empty box; hide the spinner once settled
            results.addEventListener('htmx:after:settle', function () {
                indicator?.classList.add('hidden');
                if (isMobile() && !isOpen()) {
                    // a response landed after the mobile box was closed; keep it hidden
                    results.classList.add('hidden');
                    results.classList.remove('flex');
                    return;
                }
                const hasContent = results.innerHTML.trim() !== '';
                results.classList.toggle('hidden', !hasContent);
                results.classList.toggle('flex', hasContent);
            });
            // a failed request never settles, so hide the spinner on error too
            input.addEventListener('htmx:error', function () {
                indicator?.classList.add('hidden');
            });
        })();
    </script>
</nav>
