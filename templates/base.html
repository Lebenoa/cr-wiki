<!DOCTYPE html>
<html lang="{{ ctx.lang }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="shortcut icon" href="/static/favicon.avif" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="{{ ctx.font_css_url() }}" rel="stylesheet" />
    <script src="/static/thirdparty/htmx.js" defer></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/theme_editor.js" defer></script>
    <script src="/static/js/catalog_filter.js" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% block title %}{% endblock %}
    <link rel="canonical" href="{{ ctx.canonical_url() }}" />
    {% for alt in ctx.langs() %}
    <link rel="alternate" hreflang="{{ alt }}" href="{{ ctx.lang_url(alt) }}" />
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ ctx.default_lang_url() }}" />
    {% block robots %}<meta name="robots" content="index, follow" />{% endblock %}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ ctx.l.t("site_name") }}" />
    <meta property="og:url" content="{{ ctx.canonical_url() }}" />
    <meta property="og:locale" content="{{ ctx.og_locale() }}" />
    <script>
        htmx.config.globalViewTransitions = true;
    </script>
</head>

<body>
    {% include "navbar.html" %}

    {% block content %}{% endblock %}
</body>

</html>
