<!DOCTYPE html>
<html lang="@ctx.lang">

<head>
    @include 'layout/head.html'
</head>

<body>
    @include 'layout/navbar.html'

    <h1 class="page-title">%gacha_page_header</h1>

    <div class="filter-bar">
        @include 'components/filter_input.html'
    </div>

    <div class="max-w-6xl mx-auto px-8 py-4 flex flex-col gap-10">
        @for p in pools
        <section>
            <h2 class="section-title">@{ctx.gacha_tier_label(p.tier)}
                <span class="text-sm font-label font-normal text-foreground-muted">(@p.entries.len)</span></h2>
            <div class="card-grid">
                @for e in p.entries
                <a href="/@{e.kind}s/@e.id" hx-boost="true" data-cr-card data-name="@e.name"
                    class="entity-card">
                    <img src="@{ctx.img_src(e.kind + 's', e.image)}" alt="@e.name" class="h-20 w-full object-contain" />
                    <span class="card-title">@e.name</span>
                    @if g := e.grade
                    <span class="@{ctx.grade_badge_cls(g)}">@{ctx.grade_label_int(g)}</span>
                    @end
                    <span class="text-xs font-mono text-foreground-muted">@e.odds%</span>
                </a>
                @endfor
            </div>
        </section>
        @endfor
    </div>
</body>

</html>
